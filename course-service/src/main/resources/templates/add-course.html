<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Add New Course</h2>

    <form th:action="@{/courses/new}"
          th:object="${course}"
          method="post">

        <div class="mb-3">
            <label class="form-label">
                Title
            </label>

            <input
                    class="form-control"
                    th:field="*{title}">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Description
            </label>

            <input
                    class="form-control"
                    th:field="*{description}">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Category
            </label>

            <input
                    class="form-control"
                    th:field="*{courseCategory}">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Total Lessons
            </label>

            <input
                    type="number"
                    class="form-control"
                    th:field="*{totalLessons}">
        </div>

        <button
                type="submit"
                class="btn btn-primary">
            Create Course
        </button>

    </form>

</div>

</body>
</html>
