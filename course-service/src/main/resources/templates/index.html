<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title>Learning Progress Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="/">
            Learning Progress Tracker
        </a>

        <div class="navbar-nav">
            <a class="nav-link active" href="/">
                Home
            </a>

            <a class="nav-link" href="/courses/new">
                Add Course
            </a>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Available Courses</h2>

        <a href="/courses/new"
           class="btn btn-success">
            + Add New Course
        </a>

    </div>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="course : ${courses}">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4 class="card-title"
                        th:text="${course.title}">
                    </h4>

                    <p class="card-text"
                       th:text="${course.description}">
                    </p>

                    <span class="badge bg-primary"
                          th:text="${course.courseCategory}">
                    </span>

                    <hr>

                    <p>
                        <strong>Total Lessons:</strong>
                        <span th:text="${course.totalLessons}">
                        </span>
                    </p>

                </div>

            </div>

        </div>

    </div>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(courses)}">

        No courses available yet.
        Create your first course!

    </div>

</div>

</body>
</html>
