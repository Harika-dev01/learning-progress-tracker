server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: course-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/course_db}
    username: ${SPRING_DATASOURCE_USERNAME:learninguser}
    password: ${SPRING_DATASOURCE_PASSWORD:learningpass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
