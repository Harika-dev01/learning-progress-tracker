server:
  port: 8081

spring:
  application:
    name: course-service

  datasource:
    url: jdbc:mysql://localhost:3306/course_db
    username: learninguser
    password: learningpass

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false